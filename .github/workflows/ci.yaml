name: Commit CI
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

jobs:
  prepare-autohotkey-binaries:
    name: Prepare AutoHotkey Binaries
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Restore prepared AutoHotkey
        id: cache-autohotkey
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/rabbit-autohotkey
          key: >-
            ${{ runner.os }}-rabbit-autohotkey-v2-${{
            hashFiles('.github/scripts/prepare-autohotkey.ps1', 'assets/*.svg') }}

      - name: Prepare AutoHotkey
        if: steps.cache-autohotkey.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          .github/scripts/prepare-autohotkey.ps1 `
            -OutputDirectory "$env:RUNNER_TEMP/rabbit-autohotkey"

      - name: Repair prepared AutoHotkey cache
        shell: pwsh
        run: |
          if (!(Test-Path -LiteralPath "$env:RUNNER_TEMP/rabbit-autohotkey\Compiler\Ahk2Exe.exe")) {
            .github/scripts/prepare-autohotkey.ps1 `
              -OutputDirectory "$env:RUNNER_TEMP/rabbit-autohotkey"
          }

      - name: Copy prepared AutoHotkey
        shell: pwsh
        run: |
          Copy-Item "$env:RUNNER_TEMP/rabbit-autohotkey/*" . -Recurse -Force
          if (!(Test-Path -LiteralPath "Compiler\Ahk2Exe.exe")) {
            Get-ChildItem -LiteralPath "$env:RUNNER_TEMP/rabbit-autohotkey" -Recurse -Force |
                Select-Object FullName
            throw "The prepared AutoHotkey directory does not contain Compiler\Ahk2Exe.exe."
          }

      - name: Upload Icon
        uses: actions/upload-artifact@v7
        with:
          name: Icon
          path: |
            rabbit.ico
            rabbit-alt.ico
            rabbit-ascii.ico

      - name: Upload AutoHotkey
        uses: actions/upload-artifact@v7
        with:
          name: AutoHotkey
          path: |
            AutoHotkey32.exe
            AutoHotkey64.exe
            Compiler/**

  prepare-dependency:
    name: Prepare Dependency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Resolve Librime release
        id: librime-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/resolve-librime-release.sh

      - name: Restore Librime
        id: cache-librime
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/rabbit-librime
          key: >-
            ${{ runner.os }}-librime-v1-${{
            hashFiles(
              '.github/scripts/resolve-librime-release.sh',
              '.github/scripts/prepare-librime.sh'
            )
            }}-${{ steps.librime-release.outputs.x86_sha256
            }}-${{ steps.librime-release.outputs.x64_sha256
            }}-${{ steps.librime-release.outputs.deps_x86_sha256 }}

      - name: Prepare Librime
        if: steps.cache-librime.outputs.cache-hit != 'true'
        env:
          LIBRIME_X86_URL: ${{ steps.librime-release.outputs.x86_url }}
          LIBRIME_X86_SHA256: ${{ steps.librime-release.outputs.x86_sha256 }}
          LIBRIME_X64_URL: ${{ steps.librime-release.outputs.x64_url }}
          LIBRIME_X64_SHA256: ${{ steps.librime-release.outputs.x64_sha256 }}
          LIBRIME_DEPS_X86_URL: ${{ steps.librime-release.outputs.deps_x86_url }}
          LIBRIME_DEPS_X86_SHA256: ${{ steps.librime-release.outputs.deps_x86_sha256 }}
        run: |
          bash .github/scripts/prepare-librime.sh \
            "$RUNNER_TEMP/rabbit-librime"

      - name: Copy prepared Librime
        run: |
          cp "$RUNNER_TEMP/rabbit-librime/rime-x86.dll" .
          cp "$RUNNER_TEMP/rabbit-librime/rime-x64.dll" .
          cp -R "$RUNNER_TEMP/rabbit-librime/opencc" .

      - name: Upload Rime
        uses: actions/upload-artifact@v7
        with:
          name: Rime
          path: |
            rime-x86.dll
            rime-x64.dll

      - name: Prepare Data
        run: |
          WORK=`pwd`
          SCHEMAS=${WORK}/schemas
          plum_dir=${WORK}/plum
          rime_dir=${WORK}/Data
          rm -rf ${rime_dir} && mkdir -p ${rime_dir}
          rime_dir=${rime_dir} bash plum/rime-install
          cp ${SCHEMAS}/rabbit.yaml ${rime_dir}/
          cp -r ${WORK}/opencc ${rime_dir}/

      - name: Upload Data
        uses: actions/upload-artifact@v7
        with:
          name: Data
          path: Data

  build-rabbit:
    strategy:
      matrix:
        target: [ x86, x64 ]
        include:
          - { target: x86, ahk: AutoHotkey32.exe, rime: rime-x86.dll }
          - { target: x64, ahk: AutoHotkey64.exe, rime: rime-x64.dll }
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [ prepare-dependency, prepare-autohotkey-binaries ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Download Dependencies
        uses: actions/download-artifact@v8

      - name: Copy Artifacts
        run: |
          cp AutoHotkey/${{ matrix.ahk }} Rabbit.exe
          cp Rime/${{ matrix.rime }} ./Lib/librime-ahk/rime.dll
          cp Icon/* Lib/
          cp plum/rime-install.bat .

      - name: Set Version
        env:
          RABBIT_REF_NAME: ${{ github.ref_name }}
          RABBIT_SHA: ${{ github.sha }}
        run: |
          if [[ "$RABBIT_REF_NAME" == v* ]]; then
            VER=${RABBIT_REF_NAME:1}
          else
            VER=${RABBIT_REF_NAME}-$(git rev-parse --short "$RABBIT_SHA")
          fi
          VER=$(printf '%s' "$VER" | tr -c 'A-Za-z0-9._-' '-')
          echo "$VER"
          sed -i -E 's|global RABBIT_VERSION := .+|global RABBIT_VERSION := "'"$VER"'"|' Lib/RabbitCommon.ahk

      - name: Upload Rabbit ${{ matrix.target }}
        uses: actions/upload-artifact@v7
        with:
          name: Rabbit-${{ matrix.target }}
          path: |
            Lib/Direct2D/Direct2D.ahk
            Lib/Direct2D/LICENSE
            Lib/librime-ahk/*.ahk
            Lib/librime-ahk/rime.dll
            Lib/librime-ahk/utils
            Lib/librime-ahk/LICENSE
            Lib/GetCaretPosEx/*.ahk
            Lib/GetCaretPosEx/LICENSE.txt
            Lib/*.ahk
            Lib/*.ico
            Rabbit.exe
            *.ahk
            !*Tests.ahk
            LICENSE
            README.md
            locales/*.ini
            docs/images/candidate-layouts/*.png
            rime-install.bat

      - name: Upload Full Zip of Rabbit ${{ matrix.target }}
        uses: actions/upload-artifact@v7
        with:
          name: Rabbit-Full-${{ matrix.target }}
          path: |
            Data
            Lib/Direct2D/Direct2D.ahk
            Lib/Direct2D/LICENSE
            Lib/librime-ahk/*.ahk
            Lib/librime-ahk/rime.dll
            Lib/librime-ahk/utils
            Lib/librime-ahk/LICENSE
            Lib/GetCaretPosEx/*.ahk
            Lib/GetCaretPosEx/LICENSE.txt
            Lib/*.ahk
            Lib/*.ico
            Rabbit.exe
            *.ahk
            !*Tests.ahk
            LICENSE
            README.md
            locales/*.ini
            docs/images/candidate-layouts/*.png
            rime-install.bat

  build-rabbit-compiled:
    strategy:
      matrix:
        target: [ x86, x64 ]
        include:
          - { target: x86, ahk: AutoHotkey32.exe, rime: rime-x86.dll }
          - { target: x64, ahk: AutoHotkey64.exe, rime: rime-x64.dll }
    name: Build compiled Rabbit for ${{ matrix.target }}
    runs-on: windows-latest
    needs: [ prepare-dependency, prepare-autohotkey-binaries ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Download AutoHotkey compiler
        uses: actions/download-artifact@v8
        with:
          name: AutoHotkey
          path: deps/AutoHotkey

      - name: Download icons
        uses: actions/download-artifact@v8
        with:
          name: Icon
          path: deps/Icon

      - name: Download Rime library
        uses: actions/download-artifact@v8
        with:
          name: Rime
          path: deps/Rime

      - name: Download shared data
        uses: actions/download-artifact@v8
        with:
          name: Data
          path: Data

      - name: Prepare source and version
        shell: pwsh
        env:
          RABBIT_REF_NAME: ${{ github.ref_name }}
          RABBIT_SHA: ${{ github.sha }}
        run: |
          Copy-Item "deps/Icon/*" Lib -Force

          if ($env:RABBIT_REF_NAME.StartsWith("v")) {
            $version = $env:RABBIT_REF_NAME.Substring(1)
          } else {
            $shortSha = (git rev-parse --short $env:RABBIT_SHA)
            $version = "$($env:RABBIT_REF_NAME)-$shortSha"
          }
          $version = [regex]::Replace($version, '[^A-Za-z0-9._-]', '-')
          $path = Join-Path $env:GITHUB_WORKSPACE "Lib\RabbitCommon.ahk"
          $source = [System.IO.File]::ReadAllText($path)
          $source = [regex]::Replace(
              $source,
              'global RABBIT_VERSION := .+',
              "global RABBIT_VERSION := `"$version`""
          )
          [System.IO.File]::WriteAllText(
              $path,
              $source,
              [System.Text.UTF8Encoding]::new($false)
          )
          Write-Host "Rabbit version: $version"

      - name: Compile Rabbit
        shell: pwsh
        run: |
          $outputDirectory = Join-Path $env:GITHUB_WORKSPACE "compiled"
          New-Item -ItemType Directory -Force -Path $outputDirectory | Out-Null
          $compiler = Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "deps\AutoHotkey") `
              -Recurse -File -Filter "Ahk2Exe.exe" | Select-Object -First 1
          if (!$compiler) {
            Get-ChildItem -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "deps\AutoHotkey") `
                -Recurse -Force | Select-Object FullName
            throw "Ahk2Exe.exe was not found in the downloaded AutoHotkey artifact."
          }
          $base = Join-Path $env:GITHUB_WORKSPACE "deps\AutoHotkey\${{ matrix.ahk }}"
          $input = Join-Path $env:GITHUB_WORKSPACE "Rabbit.ahk"
          $output = Join-Path $outputDirectory "Rabbit.exe"
          & $compiler.FullName /in $input /out $output /base $base /silent verbose
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Assemble compiled package
        shell: pwsh
        run: |
          $package = Join-Path $env:GITHUB_WORKSPACE "package"
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          Copy-Item "compiled\Rabbit.exe" $package
          Copy-Item "locales" $package -Recurse
          Copy-Item "Data" $package -Recurse
          New-Item -ItemType Directory -Force -Path (Join-Path $package "docs\images\candidate-layouts") | Out-Null
          Copy-Item "docs\images\candidate-layouts\*.png" `
              (Join-Path $package "docs\images\candidate-layouts")
          Copy-Item "deps\Rime\${{ matrix.rime }}" (Join-Path $package "rime.dll")
          Copy-Item "plum\rime-install.bat" (Join-Path $package "rime-install.bat")
          Copy-Item "LICENSE" $package
          Copy-Item "README.md" $package
          Compress-Archive -Path (Join-Path $package "*") `
              -DestinationPath "rabbit-compiled-${{ matrix.target }}.zip" -Force

      - name: Upload compiled package
        uses: actions/upload-artifact@v7
        with:
          name: Rabbit-Compiled-${{ matrix.target }}
          path: rabbit-compiled-${{ matrix.target }}.zip

  create-nightly:
    name: Create Nightly release
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    needs: [ build-rabbit, build-rabbit-compiled ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download x64
        uses: actions/download-artifact@v8
        with:
          name: Rabbit-Full-x64
          path: x64

      - name: Pack x64
        working-directory: x64
        run: |
          mkdir Rime && zip -r -q ../rabbit-nightly-x64.zip *

      - name: Download x86
        uses: actions/download-artifact@v8
        with:
          name: Rabbit-Full-x86
          path: x86

      - name: Pack x86
        working-directory: x86
        run: |
          mkdir Rime && zip -r -q ../rabbit-nightly-x86.zip *

      - name: Download compiled x64
        uses: actions/download-artifact@v8
        with:
          name: Rabbit-Compiled-x64
          path: compiled-x64

      - name: Download compiled x86
        uses: actions/download-artifact@v8
        with:
          name: Rabbit-Compiled-x86
          path: compiled-x86

      - name: Rename compiled nightly packages
        run: |
          cp compiled-x64/rabbit-compiled-x64.zip rabbit-nightly-compiled-x64.zip
          cp compiled-x86/rabbit-compiled-x86.zip rabbit-nightly-compiled-x86.zip

      - name: Upload Nightly
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: latest
          prerelease: true
          title: "Nightly"
          files: |
            rabbit-nightly-x64.zip
            rabbit-nightly-x86.zip
            rabbit-nightly-compiled-x64.zip
            rabbit-nightly-compiled-x86.zip

  # Keep development builds separate from the public "latest" nightly channel.
  create-dev-nightly:
    name: Create Dev Nightly release
    if: ${{ github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    needs: [ build-rabbit, build-rabbit-compiled ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download x64
        uses: actions/download-artifact@v8
        with:
          name: Rabbit-Full-x64
          path: x64

      - name: Pack x64
        working-directory: x64
        run: |
          mkdir Rime && zip -r -q ../rabbit-dev-nightly-x64.zip *

      - name: Download x86
        uses: actions/download-artifact@v8
        with:
          name: Rabbit-Full-x86
          path: x86

      - name: Pack x86
        working-directory: x86
        run: |
          mkdir Rime && zip -r -q ../rabbit-dev-nightly-x86.zip *

      - name: Download compiled x64
        uses: actions/download-artifact@v8
        with:
          name: Rabbit-Compiled-x64
          path: compiled-x64

      - name: Download compiled x86
        uses: actions/download-artifact@v8
        with:
          name: Rabbit-Compiled-x86
          path: compiled-x86

      - name: Rename compiled dev nightly packages
        run: |
          cp compiled-x64/rabbit-compiled-x64.zip rabbit-dev-nightly-compiled-x64.zip
          cp compiled-x86/rabbit-compiled-x86.zip rabbit-dev-nightly-compiled-x86.zip

      - name: Upload Dev Nightly
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: dev-nightly
          prerelease: true
          title: "Dev Nightly"
          files: |
            rabbit-dev-nightly-x64.zip
            rabbit-dev-nightly-x86.zip
            rabbit-dev-nightly-compiled-x64.zip
            rabbit-dev-nightly-compiled-x86.zip

  create-release:
    name: Create Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [ build-rabbit, build-rabbit-compiled ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create Release
        uses: softprops/action-gh-release@v3

  upload-release:
    strategy:
      matrix:
        target: [ x86, x64 ]
    name: Upload Release for ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          name: Rabbit-Full-${{ matrix.target }}
          path: release

      - name: Pack Zip
        working-directory: release
        run: |
          mkdir Rime && zip -r -q ../rabbit-${{ github.ref_name }}-${{ matrix.target }}.zip *

      - name: Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          files: |
            rabbit-${{ github.ref_name }}-${{ matrix.target }}.zip

  upload-compiled-release:
    strategy:
      matrix:
        target: [ x86, x64 ]
    name: Upload Compiled Release for ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - name: Download Compiled Artifact
        uses: actions/download-artifact@v8
        with:
          name: Rabbit-Compiled-${{ matrix.target }}
          path: compiled

      - name: Rename Compiled Asset
        run: cp compiled/rabbit-compiled-${{ matrix.target }}.zip rabbit-${{ github.ref_name }}-compiled-${{ matrix.target }}.zip

      - name: Publish Compiled Asset
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          files: rabbit-${{ github.ref_name }}-compiled-${{ matrix.target }}.zip
