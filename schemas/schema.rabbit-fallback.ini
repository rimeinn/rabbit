; Rabbit's generic schema-settings manifest.  Scheme authors can ship a
; <schema_id>.rabbit.ini in user or shared data to replace this fallback.
; Multiple [group.<id>] sections create navigation pages in declaration order.
[meta]
format = 1
title = 方案设置
description = 修改会仅保存到当前方案的 custom 配置。

[group.general]
label = 基本设置

[field.page_size]
group = general
path = menu/page_size
type = integer
label = 本方案每页候选数
description = 覆盖 Rime 的全局候选页大小，仅对此方案生效。
min = 1
max = 10

[group.punctuator]
label = 标点
description = 修改会完整接管当前方案的标点映射；可分别恢复各个映射表的方案默认值。

[field.punctuator_full_shape]
group = punctuator
path = punctuator/full_shape
type = punctuator_map
label = 全角标点
description = 输入单个可打印 ASCII 字符时使用的全角标点映射。

[field.punctuator_half_shape]
group = punctuator
path = punctuator/half_shape
type = punctuator_map
label = 半角标点
description = 输入单个可打印 ASCII 字符时使用的半角标点映射。

[field.punctuator_symbols]
group = punctuator
path = punctuator/symbols
type = punctuator_map
label = 符号映射
description = 多字符标记对应的标点定义；支持候选列表、成对输出和自动提交。

[field.punctuator_use_space]
group = punctuator
path = punctuator/use_space
type = boolean
label = 使用空格
default = false

[field.punctuator_digit_separators]
group = punctuator
path = punctuator/digit_separators
type = string
label = 数字分隔符
default = .:

[field.punctuator_digit_separator_action]
group = punctuator
path = punctuator/digit_separator_action
type = enum
label = 数字分隔符动作
options = forward|commit
default = forward

[group.recognizer]
label = 识别器

[field.recognizer_use_space]
group = recognizer
path = recognizer/use_space
type = boolean
label = 使用空格
default = false

[field.recognizer_patterns]
group = recognizer
path = recognizer/patterns
type = recognizer_patterns
label = 识别模式
