; Rabbit's generic schema-settings manifest.  Scheme authors can ship a
; <schema_id>.rabbit.ini in user or shared data to replace this fallback.
; Multiple [group.<id>] sections create navigation pages in declaration order.
[meta]
format = 1
title = 方案设置
description = 修改会仅保存到当前方案的 custom 配置。

[group.switches]
label = 开关
description = 西文模式、全角半角、简繁转换等开关。

[field.switches]
group = switches
path = switches
type = switch_list
label = 开关选项
rows = 6

[group.menu]
label = 候选选单
description = 候选页大小、候选标签与翻页行为。

[field.page_size]
group = menu
path = menu/page_size
type = integer
label = 本方案每页候选数
description = 覆盖 Rime 的全局候选页大小，仅对此方案生效。
min = 1
max = 10

[field.menu_alternative_select_labels]
group = menu
path = menu/alternative_select_labels
type = list
label = 候选序号
rows = 10
default =

[field.menu_alternative_select_keys]
group = menu
path = menu/alternative_select_keys
type = string
label = 候选选择键
default =

[field.menu_page_down_cycle]
group = menu
path = menu/page_down_cycle
type = boolean
label = 循环翻页
default = false

[group.ascii_composer]
label = 中西文切换
description = 中西文切换键及 Caps Lock 行为。

[field.ascii_composer_good_old_caps_lock]
group = ascii_composer
path = ascii_composer/good_old_caps_lock
type = boolean
label = 保留 Caps Lock 的系统大写锁定行为
default = true

[field.ascii_composer_switch_key_shift_l]
group = ascii_composer
path = ascii_composer/switch_key/Shift_L
type = enum
label = 左 Shift
options = noop|inline_ascii|commit_text|commit_code|clear|set_ascii_mode|unset_ascii_mode
default = inline_ascii

[field.ascii_composer_switch_key_shift_r]
group = ascii_composer
path = ascii_composer/switch_key/Shift_R
type = enum
label = 右 Shift
options = noop|inline_ascii|commit_text|commit_code|clear|set_ascii_mode|unset_ascii_mode
default = commit_text

[field.ascii_composer_switch_key_control_l]
group = ascii_composer
path = ascii_composer/switch_key/Control_L
type = enum
label = 左 Control
options = noop|inline_ascii|commit_text|commit_code|clear|set_ascii_mode|unset_ascii_mode
default = noop

[field.ascii_composer_switch_key_control_r]
group = ascii_composer
path = ascii_composer/switch_key/Control_R
type = enum
label = 右 Control
options = noop|inline_ascii|commit_text|commit_code|clear|set_ascii_mode|unset_ascii_mode
default = noop

[field.ascii_composer_switch_key_caps_lock]
group = ascii_composer
path = ascii_composer/switch_key/Caps_Lock
type = enum
label = Caps Lock
options = noop|commit_text|commit_code|clear
default = clear

[field.ascii_composer_switch_key_eisu_toggle]
group = ascii_composer
path = ascii_composer/switch_key/Eisu_toggle
type = enum
label = 英数键
options = noop|inline_ascii|commit_text|commit_code|clear|set_ascii_mode|unset_ascii_mode
default = clear

[group.key_binder]
label = 按键绑定

[field.key_binder_bindings]
group = key_binder
path = key_binder/bindings
type = key_binding_list
label = 按键绑定
rows = 5

[group.punctuator]
label = 标点
description = 修改会完整接管当前方案的标点映射；可分别恢复各个映射表的方案默认值。

[field.punctuator_full_shape]
group = punctuator
path = punctuator/full_shape
type = punctuator_map
label = 全角标点
description = 输入单个可打印 ASCII 字符时使用的全角标点映射。

[field.punctuator_half_shape]
group = punctuator
path = punctuator/half_shape
type = punctuator_map
label = 半角标点
description = 输入单个可打印 ASCII 字符时使用的半角标点映射。

[field.punctuator_symbols]
group = punctuator
path = punctuator/symbols
type = punctuator_map
label = 符号映射
description = 多字符标记对应的标点定义；支持候选列表、成对输出和自动提交。

[field.punctuator_use_space]
group = punctuator
path = punctuator/use_space
type = boolean
label = 空格标点
default = false

[field.punctuator_digit_separators]
group = punctuator
path = punctuator/digit_separators
type = string
label = 数字分隔符
default = .:

[field.punctuator_digit_separator_action]
group = punctuator
path = punctuator/digit_separator_action
type = enum
label = 数字分隔符动作
options = forward|commit
default = forward

[group.recognizer]
label = 识别器

[field.recognizer_use_space]
group = recognizer
path = recognizer/use_space
type = boolean
label = 识别空格
default = false

[field.recognizer_patterns]
group = recognizer
path = recognizer/patterns
type = recognizer_patterns
label = 识别模式
