; Rabbit's generic schema-settings manifest.  Scheme authors can ship a
; <schema_id>.rabbit.ini in user or shared data to replace this fallback.
; Multiple [group.<id>] sections create navigation pages in declaration order.
[meta]
format = 1
title = 方案设置
description = 修改会仅保存到当前方案的 custom 配置。

[group.general]
label = 基本设置

[field.page_size]
group = general
path = menu/page_size
type = integer
label = 本方案每页候选数
description = 覆盖 Rime 的全局候选页大小，仅对此方案生效。
min = 1
max = 10
